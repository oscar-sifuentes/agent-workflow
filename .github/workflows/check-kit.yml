name: Check kit

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-test
        run: bash scripts/check-kit.sh
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
